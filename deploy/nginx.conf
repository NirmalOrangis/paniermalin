# /etc/nginx/sites-available/paniermalin  (VPS: Nginx + PHP-FPM 8.3)
# Replace example.fr and the root path, then:
#   ln -s /etc/nginx/sites-available/paniermalin /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d example.fr -d www.example.fr

server {
    listen 80;
    listen [::]:80;
    server_name example.fr www.example.fr;

    root /var/www/paniermalin/public;
    index index.php;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;
    gzip_min_length 512;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(svg|webmanifest|txt)$ {
        expires 30d;
        try_files $uri =404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param APP_ENV prod;
        fastcgi_param APP_URL https://example.fr;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Any other .php file (there should be none under public/) is denied.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
